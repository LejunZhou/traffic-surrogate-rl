[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "traffic-surrogate-rl"
version = "0.1.0"
description = "Sample-efficient surrogate traffic model for RL-based ramp metering control"
requires-python = ">=3.11"
dependencies = [
    # Deep learning
    "torch>=2.0",
    # Reinforcement learning
    "stable-baselines3>=2.0",
    "gymnasium>=0.29",
    # SUMO Python bindings (SUMO itself must be installed separately: https://sumo.dlr.de)
    "traci>=1.18",
    "sumolib>=1.18",
    # Numerics and utilities
    "numpy",
    "matplotlib",
    "pyyaml",
    "wandb",
]

[project.optional-dependencies]
dev = [
    "pytest>=7",
    "pytest-cov",
]
# Self-contained SUMO (binaries + matching bindings) — the version matters:
# the merge/insertion physics differ between SUMO releases (M7 progress §7.1),
# and every M7 result was produced with 1.27.1.
sumo = [
    "eclipse-sumo==1.27.1",
    "traci==1.27.1",
    "sumolib==1.27.1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-dir]
"" = "src"
