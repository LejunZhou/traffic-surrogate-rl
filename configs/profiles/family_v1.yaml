# Demand-profile family v1 (draft_pipeline.md §4.1, Appendix B).
# Piecewise-constant on 5-min blocks (12 blocks, 10 control steps each).
# All rates in veh/h, all times in minutes. Sampled per episode by
# sumo_env.demand_profiles.ProfileFamily; frozen sets live next to this file.
version: 1
block_min: 5
horizon_min: 60
mainline:
  families: {peak: 0.6, step: 0.3, const: 0.1}
  peak:
    d_base: [1200, 1700]
    amplitude: [300, 900]
    t_center_min: [15, 35]
    half_width_min: [7.5, 15]
    d_max: 2300
    peak_end_max_min: 45        # raised-cosine bump must be over by minute 45 (D11)
  step:
    d_base: [1200, 1600]
    d_high: [1800, 2300]
    t1_min: [5, 25]
    ramp_min: 10                # linear rise over 10 min
    t2_offset_min: [10, 20]
    p_step_down: 0.5
    plateau_end_max_min: 45     # without an explicit step-down the plateau still ends by 45 (D11)
  const:
    d: [1500, 2000]
ramp:
  families: {surge: 0.8, const: 0.2}
  surge:
    r_base: [200, 500]
    amplitude: [0, 500]
    t_start_min: [5, 40]
    length_min: [10, 20]
    r_max: 1000
  const:
    r: [300, 800]
# Out-of-distribution families (evaluation only, set O).
ood:
  double:                       # two raised-cosine peaks
    d_base: [1200, 1600]
    amplitude: [300, 700]
    t_center_min: [[10, 18], [32, 40]]
    half_width_min: [5, 8]
    d_max: 2300
  plateau:                      # 2200 vph for 30 min
    d_base: [1300, 1600]
    d_high: 2200
    t1_min: [5, 15]
    length_min: 30
  early_surge:                  # M-peak with a 600 vph ramp surge starting before the peak
    amplitude_r: 600
    lead_min: [10, 20]
    length_min: [10, 20]
    r_base: [200, 400]
