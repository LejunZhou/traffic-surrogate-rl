# PPO training directly in SUMO via TraCI (Milestone 6).
# Pairs with src/rl/train_ppo.py via env.type=sumo.
#
# PPO algorithm + architecture mirror configs/rl/ppo_surrogate.yaml so the
# M6 (SUMO-trained) and M5c (surrogate-trained) policies can be compared
# apples-to-apples. The only intentional divergences are:
#   - env: SUMO-specific blocks (sumo_binary, network_dir, density stats)
#   - training.total_timesteps: SUMO is 100-1000x slower per step than the
#     surrogate, so we cap the run at 20k unless the budget allows more.

env:
  type: "sumo"

  # Path to the SUMO scenario config (network / simulation / detectors /
  # demand defaults). SumoEnv builds the network + routes from this on
  # first reset(); subsequent resets reuse the same network files.
  sumo_config: "configs/sumo/phase1_1.yaml"

  # Demand sampling at reset(). Single-element list = degenerate sample
  # to 2000 vph every episode. Matches the M5c surrogate training
  # distribution (dataset_constant_inflow.yaml) and the phase1_1.yaml
  # scenario default.
  demand_levels: [2000.0]

  # z-score normalization for the density obs component. Pinned to the
  # M2 training-set stats so the obs distribution matches what the M5c
  # surrogate policy expects when transferred (M6.5).
  density_mean: 18.730
  density_std: 5.971

  # Obs-side queue normalizer (must match SurrogateEnv's value if the
  # M5c policy is to receive identically-scaled observations during
  # transfer). 100.0 matches configs/rl/ppo_surrogate.yaml.
  queue_norm_scale: 100.0

  # Shaped reward — M5c form. Identical to the surrogate config.
  reward:
    alpha: 1.0
    beta: 1.0
    gamma: 1.0
    rho_freeflow: 20.0
    queue_norm: 100.0
    warmup_s: 0

  # SumoEnv-specific
  sumo_binary: "sumo"
  network_dir: "data/raw/rl_network"

ppo:
  policy: "MlpPolicy"
  policy_kwargs:
    net_arch:
      pi: [512, 512, 512]
      vf: [512, 512, 512]
    activation_fn: "tanh"
  n_steps: 120
  batch_size: 120
  n_epochs: 5
  learning_rate: 0.0001
  gamma: 0.99
  gae_lambda: 0.95
  clip_range: 0.2
  ent_coef: 0.01
  vf_coef: 0.5
  max_grad_norm: 0.5
  device: "auto"
  verbose: 1

training:
  # SUMO+RL is much slower than surrogate+RL. With ~10-30 s per episode,
  # 20k timesteps ≈ 167 episodes ≈ 30-90 min wall clock. The surrogate
  # config uses 2M; matching that on SUMO would be days. Raise this
  # deliberately when the experiment budget allows.
  total_timesteps: 20000

  seed: 42
  checkpoint_freq: 2400
  progress_bar: false
  wandb_info_log_freq: 1000

output:
  base_dir: "runs/rl"
  run_name: "ppo_sumo_constant_inflow"
  wandb:
    enabled: true
    project: "sumo-to-pde"
    entity:
    run_name: "ppo_sumo_constant_inflow"
    tags:
      - "ppo"
      - "sumo"
      - "phase1_1"
