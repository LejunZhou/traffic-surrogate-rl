# M7 run 3: ppo_sumo.yaml + narrower / decaying exploration.
#
# Why: in run 2 (symmetric action box, this file's other settings) the
# policy std stayed at 1.0 (~0.5 in u-units) for the whole run. PPO then
# optimises the return of a very wide action distribution next to the
# u >= 0.7 breakdown cliff, and the best *mean* for that distribution is
# far below the u = 0.6 optimum: the deterministic policy slid from
# u = 0.31 (-132, 2400 steps) to u = 0.13 (-209, 12000 steps) while the
# stochastic ep_rew_mean kept improving. Three changes, all exploration-
# side (reward and env untouched):
#   - policy_kwargs.log_std_init: -1.0  -> initial std 0.37 (~0.18 in u)
#   - ent_coef: 0.0                     -> nothing holds the std open
#   - learning_rate: 3e-4               -> SB3 default; lets log_std adapt
#
# Pairs with src/rl/train_ppo.py via env.type=sumo.
#
# PPO algorithm + architecture mirror configs/rl/ppo_surrogate.yaml so the
# SUMO-trained and surrogate-trained policies can be compared apples-to-
# apples. Intentional divergences:
#   - env: SUMO-specific blocks (sumo_binary, network_dir, density stats)
#   - env.reward: the M7 outflow term (delta > 0) is only computable in SUMO;
#     the surrogate path has no flow prediction and runs delta = 0.
#   - ppo.n_steps: 480 (4 episodes per update) instead of 120, to average
#     SUMO's per-step count noise before each PPO update (M6b diagnosis).
#   - training.total_timesteps: SUMO is 100-1000x slower per step than the
#     surrogate, so we cap the run at 20k unless the budget allows more.

env:
  type: "sumo"

  # Path to the SUMO scenario config (network / simulation / detectors /
  # demand defaults). SumoEnv builds the network + routes from this on
  # first reset(); subsequent resets reuse the same network files.
  sumo_config: "configs/sumo/phase1_1.yaml"

  # Demand sampling at reset(). Single-element list = degenerate sample
  # to 2000 vph every episode (2000 mainline + 800 ramp cap = 2800 vph
  # total at u=1). Matches the M5c surrogate training distribution
  # (dataset_constant_inflow.yaml) and the phase1_1.yaml scenario default.
  demand_levels: [2000.0]

  # z-score normalization for the density obs component. Pinned to the
  # M2 training-set stats so the obs distribution matches what the M5c
  # surrogate policy expects when transferred (M6.5).
  density_mean: 18.730
  density_std: 5.971

  # Obs-side queue normalizer (must match SurrogateEnv's value if a
  # surrogate policy is to receive identically-scaled observations during
  # transfer). 100.0 matches configs/rl/ppo_surrogate.yaml.
  queue_norm_scale: 100.0

  # Milestone 7 outflow-based reward (src/rl/reward.py):
  #   r = -delta * max(0, q_ref - q_out) / q_ref     lost mainline outflow (network arrivals)
  #       -beta  * (queue / queue_norm)^2            ramp queue
  #       -gamma * std(rho) / sigma_ref              spatial uniformity
  # Every term is O(1) per control step so delta/beta/gamma are comparable.
  #
  # Weights balanced from the REAL constant-u sweep on this scenario
  # (_progress/m7_u_sweep_seed0.jsonl, SUMO 1.27.1, seed 0) with
  # scripts/balance_reward_terms.py: each term's episode-sum RANGE across
  # u = 0.0..1.0 is equalised so no single term decides the optimum
  # (max per-term share 0.62 at any constant u). Sweep facts that set them:
  #   - served outflow = 2000 + 800*u up to u = 0.6 (2476 vph), then the
  #     merge breaks down: ~1700 vph at u >= 0.7  -> q_ref = 2476 (peak)
  #   - density std jumps from <10 to 90-130 veh/km in the breakdown, so
  #     the std term's range is ~15x the others' -> gamma is small; it
  #     acts as a breakdown indicator rather than a free-flow shaper.
  #   - best constant policy under these weights: u = 0.6 (-43) vs
  #     u = 0.5 (-65), u = 0.7 (-267), u = 0 (-263), u = 1 (-327).
  # Re-derive after any scenario / SUMO-version change:
  #   python scripts/run_u_sweep_sumo.py --out _progress/m7_u_sweep_seed0.jsonl
  #   python scripts/balance_reward_terms.py --sweep _progress/m7_u_sweep_seed0.jsonl
  reward:
    delta: 4.45
    beta: 1.0
    gamma: 0.067
    q_ref: 2476.0
    queue_norm: 400.0
    sigma_ref: 6.0
    # First vehicle needs ~60 s to reach det_18 (2000 m at 33 m/s); mask the
    # reward for the first 3 control steps so the outflow term does not
    # penalise an empty road the policy cannot influence.
    warmup_s: 90

  # PPO acts in a symmetric Box [-1, 1] that is rescaled to u in [0, 1]
  # (gymnasium RescaleAction in train_ppo._make_env). Without this, SB3's
  # zero-initialised policy mean sits at u = 0 and half of every sampled
  # batch clips to 0: M6, M6b and M7 run 1 all collapsed to u = 0 that way
  # (M7 run 1: approx_kl ~1e-4, clip_fraction 0, deterministic u = 0.007
  # at 4800 steps). Eval scripts detect the model's bounds and map back.
  symmetric_action: true

  # SumoEnv-specific
  sumo_binary: "sumo"
  network_dir: "data/raw/rl_network"

ppo:
  policy: "MlpPolicy"
  policy_kwargs:
    net_arch:
      pi: [512, 512, 512]
      vf: [512, 512, 512]
    activation_fn: "tanh"
    log_std_init: -1.0
  # 4 full episodes (4 x 120 control steps) per PPO update. M6/M6b used 120
  # (one episode) and the per-step SUMO noise was the suspected cause of
  # the u=0 collapse; averaging over 4 episodes halves the advantage noise.
  n_steps: 480
  batch_size: 120
  n_epochs: 5
  learning_rate: 0.0003
  gamma: 0.99
  gae_lambda: 0.95
  clip_range: 0.2
  ent_coef: 0.0
  vf_coef: 0.5
  max_grad_norm: 0.5
  device: "auto"
  verbose: 1

training:
  # SUMO+RL is much slower than surrogate+RL. With ~13 s per episode,
  # 20k timesteps ≈ 167 episodes ≈ 35-40 min wall clock (M6.1 benchmark).
  # Raise this deliberately when the experiment budget allows.
  total_timesteps: 20000

  seed: 42
  checkpoint_freq: 2400
  progress_bar: false
  wandb_info_log_freq: 1000

output:
  base_dir: "runs/rl"
  run_name: "ppo_sumo_outflow_reward_narrow_explore"
  wandb:
    enabled: true
    project: "sumo-to-pde"
    entity:
    run_name: "ppo_sumo_outflow_reward_narrow_explore"
    tags:
      - "ppo"
      - "sumo"
      - "phase1_1"
      - "m7_outflow_reward"
