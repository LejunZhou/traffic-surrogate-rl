# M7 run 5 — demand-range training on the fixed SUMO scenario (2026-08-29).
# Derived from ppo_sumo_m7_run4.yaml (same PPO hyper-parameters) with:
#   env.demand_levels      1500..2000 vph step 100 (mainline, sampled per episode)
#   env.ramp_demand_levels 400 / 600 / 800 vph (ramp arrivals, sampled per episode)
#   env.observe_ramp_demand true   -> 23-dim observation
#   env.sumo_overrides.vehicle.speed_dev 0.03 -> 3 % driver-speed spread
#                                      (domain randomisation, progress §7.7)
#   env.reward             δ 3.572 / β 1 / γ 0.063, re-balanced over the grid (§7.11)
#   training.action_init_u 0.3     -> initial policy = 480 vph green capacity
#   training.eval_cycle_cells true, n_eval_episodes 18 -> deterministic eval
#                          walks all 6 x 3 cells with fixed seeds every 2400 steps
#   training.total_timesteps 60000 -> ~500 episodes (~28 per cell)
env:
  type: sumo
  sumo_config: configs/sumo/phase1_1.yaml
  demand_levels:
  - 1500.0
  - 1600.0
  - 1700.0
  - 1800.0
  - 1900.0
  - 2000.0
  ramp_demand_levels:
  - 400.0
  - 600.0
  - 800.0
  observe_ramp_demand: true
  density_mean: 18.73
  density_std: 5.971
  queue_norm_scale: 100.0
  reward:
    delta: 3.572
    beta: 1.0
    gamma: 0.063
    q_ref: 2476.0
    queue_norm: 400.0
    sigma_ref: 6.0
    warmup_s: 90
  symmetric_action: true
  sumo_binary: sumo
  network_dir: data/raw/rl_network
  sumo_overrides:
    vehicle:
      speed_dev: 0.03
ppo:
  policy: MlpPolicy
  policy_kwargs:
    net_arch:
      pi:
      - 512
      - 512
      - 512
      vf:
      - 512
      - 512
      - 512
    activation_fn: tanh
    log_std_init: -2.0
  n_steps: 480
  batch_size: 120
  n_epochs: 5
  learning_rate: 0.0003
  gamma: 0.99
  gae_lambda: 0.95
  clip_range: 0.2
  ent_coef: 0.0
  vf_coef: 0.5
  max_grad_norm: 0.5
  device: auto
  verbose: 1
training:
  total_timesteps: 60000
  seed: 42
  checkpoint_freq: 4800
  eval_freq: 2400
  n_eval_episodes: 18
  action_init_u: 0.3
  progress_bar: false
  wandb_info_log_freq: 1000
  eval_cycle_cells: true
  eval_seed: 10000
output:
  base_dir: runs/rl
  run_name: ppo_sumo_m7_run5_range
  wandb:
    enabled: true
    project: sumo-to-pde
    entity: null
    run_name: ppo_sumo_m7_run5_range
    tags:
    - ppo
    - sumo
    - phase1_1
    - m7_outflow_reward
