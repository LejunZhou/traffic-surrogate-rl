# Baseline DeepONet surrogate.
# Learns ramp_control(t) -> density(x, t) under constant mainline inflow.

data:
  # Source of truth for road geometry, detector grid, simulation horizon,
  # control interval, and default constant demand used for filtering samples.
  sumo_config: "configs/sumo/phase1_1.yaml"

  raw_dir: "data/raw/training_data"
  split_index_file: "data/splits/split_index.json"
  metadata_file: "data/splits/metadata.json"
  # The M2 dataset was generated with dataset_constant_inflow.yaml's
  # demand_levels: [1500], which overrides phase1_1.yaml's 2000 vph
  # default. Pin the filter explicitly so apply_sumo_config_defaults
  # doesn't auto-fill 2000 (which would match zero samples).
  constant_mainline_demand_vph: 1500

  # Random query points per rollout during training.
  # Validation/test use the full N_x x T_ctrl grid.
  n_query_points: 512

  # RL uses partial action histories: [u_0, ..., u_k, 0, ..., 0].
  # These settings keep the original non-padded rollout and add padded-prefix
  # training views from the same SUMO trajectory without rerunning SUMO.
  control_augmentation:
    include_full_control: true
    padded_samples_per_rollout:
      train: 16
      val: 0
      test: 0
    min_prefix_steps: 1
    # null means T_ctrl - 1, so every padded view has at least one unknown
    # future control entry set to zero.
    max_prefix_steps:
    seed: 42

model:
  # auto means: simulation.duration_s / simulation.dt_ctrl_s from data.sumo_config.
  branch_input_dim: "auto"
  trunk_input_dim: 2
  hidden_dim: 128
  latent_dim: 128

training:
  seed: 42
  device: "auto"
  n_epochs: 1000
  batch_size: 16
  eval_batch_size: 16
  num_workers: 0
  lr: 0.001
  weight_decay: 0.000001
  grad_clip_norm: 1.0
  eval_every: 10

output:
  base_dir: "runs/surrogate"
  run_name: "deeponet_constant_inflow"
  wandb:
    enabled: false
    project: "sumo-to-pde"
    entity:
    run_name: "surrogate"
