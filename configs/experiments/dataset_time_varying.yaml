# Direct demand-and-control operator:
# (mainline arrivals, ramp arrivals, u) -> (density, mean exit flow).
base_sumo_config: m14/configs/scenario.yaml

dataset:
  n_samples: 1000
  random_seed: 42
  # Run SUMO for three minutes before the one-hour learning horizon. During
  # this discarded pre-roll, mainline and ramp demand are held at the first
  # values of the sampled episode profile and the ramp meter is fixed at 0.5.
  # Reset the upstream ramp queue and pending requests before recording;
  # already admitted vehicles remain on the road.
  # The saved .npz arrays remain 120 steps long with t_grid starting at zero.
  # Warmup duration and meter setting are read from the scenario simulation block.
  # Use the exact schedule shared by the entire M14 study.
  # The authoritative segments are demand.profile_segments in base_sumo_config.
  demand_profile_family:
    type: scaled_template
    mainline_scale_range: [1.0, 1.0]
    ramp_scale_range: [1.0, 1.0]
  ramp_control_types: [constant, piecewise_constant, smooth, ramp_step]

splits:
  train_frac: 0.9
  val_frac: 0.05
  test_frac: 0.05

output:
  raw_dir: data/raw/time_varying
  splits_dir: data/splits/time_varying
  network_dir: data/raw/time_varying/network
  save_heatmaps: true
  heatmap_every_n: 25
