# Round-0 plant-model dataset (M8 step 2, draft §6.1): N_0 rollouts of the
# training profile family driven by the behaviour-controller mixture.
# Generated by scripts/generate_round0_dataset.py (8 SUMO workers by default).
env:
  sumo_config: configs/sumo/scenario_v2.yaml
  profiles: {family: configs/profiles/family_v1.yaml}
  # provisional observation normalisers for the closed-loop behaviour
  # controllers (ALINEA de-normalises; the values only need to be consistent)
  density_mean: 20.0
  density_std: 12.0
  queue_norm_scale: 100.0
  observation: {lookahead_steps: 0}
  reward:            # only used to log returns of the behaviour rollouts
    delta: 3.572
    beta: 1.0
    gamma: 0.063
    q_ref: 2476.0
    q_ref_mode: offered
    q_cap: 2476.0
    queue_norm: 400.0
    sigma_ref: 6.0
    warmup_s: 90
dataset:
  n_rollouts: 480
  seed: 0
  sumo_seed_base: 50000
  mixture:
    constant: 0.20
    alinea: 0.25
    store_flush: 0.20
    legacy_policy: 0.15
    random_signal: 0.20
  legacy_policy_path: runs/rl/ppo_sumo_m7_run7_range_m7_seed1_20260830_114758/best_model_multiseed.zip
splits: {train_frac: 0.7, val_frac: 0.15, seed: 0}
output:
  store_dir: data/plant_v2/round0
  network_dir: data/plant_v2/network
  workers: 8
