# Round-0 plant-model dataset for scenario v3b (M14). Mixture per the M13
# reading: the storage-then-release schedules (store_flush + feedforward)
# and a 40 % closed-loop share; no legacy run-7 policy.
env:
  sumo_config: configs/sumo/scenario_v3b.yaml
  profiles: {family: configs/profiles/family_v2.yaml}
  density_mean: 20.0
  density_std: 12.0
  queue_norm_scale: 100.0
  observation: {lookahead_steps: 0}
  reward:            # only used to log returns of the behaviour rollouts
    form: tts
    tts_scale: 1.0
    dx_km: 0.1
    delta: 3.572
    beta: 1.0
    gamma: 0.063
    q_ref: 2476.0
    q_ref_mode: offered
    q_cap: 2476.0
    queue_norm: 400.0
    sigma_ref: 6.0
    warmup_s: 90
dataset:
  n_rollouts: 288
  seed: 14
  sumo_seed_base: 72000
  per_entry_seeds: true
  storage_mandatory_frac: 0.5
  storage_mandatory_vph: 2500
  mixture:
    alinea_wide: 0.25
    alinea_dither: 0.15
    store_flush: 0.25
    feedforward: 0.15
    random_signal: 0.10
    constant: 0.10
splits: {train_frac: 0.7, val_frac: 0.15, seed: 0}
output:
  store_dir: data/plant_v3b/round0
  network_dir: data/plant_v3b/network
  workers: 8
