# M14 v3b: fixed road geometry, SUMO timing, meter capacity, and detectors.
network:
  highway_length_m: 2000.0
  ramp_position_m: 1300.0
  ramp_length_m: 200.0
  speed_limit_mps: 33.33
  ramp_speed_limit_mps: 16.67   # 60 km/h ramp (2026-09-22; the original M14 study used 33.33 = 120 km/h)
  ramp_entry_angle_deg: 10.0
  acceleration_lane_length_m: 100.0
  num_lanes: 1
simulation:
  # Discard a 3-minute pre-roll at the first demand values, then reset the
  # upstream ramp queue before the recorded one-hour horizon.
  warmup_s: 180
  warmup_ramp_control: 0.5
  duration_s: 3600
  step_length_s: 1
  dt_ctrl_s: 30
  seed: 42
  sumo_binary: sumo
  max_depart_delay_s: -1
  sumo_extra_args:
  - --extrapolate-departpos
demand:
  mainline_demand_vph: 1250  # initial value; profile_segments defines the full episode
  ramp_demand_vph: 250       # initial value before metering
  ramp_discharge_vph: 1200
  ramp_model: metered_queue
  # Canonical one-hour demand; rates are veh/h, times are minutes.
  # Pairs specify linear transitions, sampled at each 30-second interval start.
  # Explicit study profiles may override this schedule.
  demand_profile: fixed
  profile_segments:
    - {start_min: 0,  end_min: 10, mainline_vph: 1250,         ramp_vph: 250}
    - {start_min: 10, end_min: 20, mainline_vph: 1600,         ramp_vph: 400}
    - {start_min: 20, end_min: 25, mainline_vph: [1600, 1800], ramp_vph: [400, 900]}
    - {start_min: 25, end_min: 40, mainline_vph: 1800,         ramp_vph: 900}
    - {start_min: 40, end_min: 45, mainline_vph: 1800,         ramp_vph: [900, 300]}
    - {start_min: 45, end_min: 50, mainline_vph: [1800, 1100], ramp_vph: 300}
    - {start_min: 50, end_min: 60, mainline_vph: 1100,         ramp_vph: 300}
  ramp_stopline_offset_m: 200.0
  ramp_queue_max_veh: null
vehicle:
  idm_tau_s: 1.0
  depart_speed: desired
  speed_dev: 0.03
  min_gap_m: 2.0
detectors:
  n_detectors: 19
  spacing_m: 100.0
  start_position_m: 100.0
  vehicle_length_m: 5.0
  density_method: occupancy
  merge_station_lanes: mainline
  occupancy_effective_length_m: 5.0
  jam_density_veh_km: 142.857
output:
  raw_dir: data/rollouts
  network_dir: data/networks/default
